# ============================================================
# Face Attendance System - Docker Compose
# ============================================================
# Complete containerized setup with all services
# ============================================================
# The `version:` key is intentionally absent - it is obsolete in Compose v2
# and only emits an "the attribute `version` is obsolete" warning.
#
# Secrets are NOT defaulted here. Anything marked ${VAR:?...} makes the stack
# fail fast with a clear message instead of silently booting with a known
# password. Copy .env.example to .env and fill it in.

services:
  # ==========================================================
  # MySQL Database
  # ==========================================================
  mysql:
    image: mysql:8.0
    container_name: face-attendance-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required - copy .env.example to .env and set it}
      MYSQL_DATABASE: ${DB_NAME:-face_attendance}
      MYSQL_USER: ${DB_USERNAME:-faceadmin}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required - copy .env.example to .env and set it}
    ports:
      - "${DB_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - face-attendance-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:?DB_PASSWORD is required}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==========================================================
  # Redis Cache
  # ==========================================================
  redis:
    image: redis:7-alpine
    container_name: face-attendance-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - face-attendance-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    command: redis-server --appendonly yes

  # ==========================================================
  # Python Face Recognition Service
  # ==========================================================
  python-face-service:
    build:
      context: ./face-service-python
      dockerfile: ../Dockerfile.python
    container_name: face-attendance-python
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PYTHON_PORT: ${PYTHON_PORT:-8000}
      DEBUG: ${DEBUG:-false}
      RECOGNITION_THRESHOLD: ${PYTHON_RECOGNITION_THRESHOLD:-0.5}
      MIN_FACE_QUALITY_SCORE: ${MIN_FACE_QUALITY_SCORE:-0.3}
      INSIGHTFACE_MODEL_NAME: ${INSIGHTFACE_MODEL_NAME:-buffalo_s}
      INSIGHTFACE_CTX_ID: ${INSIGHTFACE_CTX_ID:--1}
      PERFORMANCE_MONITORING: ${PERFORMANCE_MONITORING:-true}
    ports:
      - "${PYTHON_PORT:-8000}:8000"
    volumes:
      # Persist InsightFace models to avoid re-downloading
      - insightface_models:/root/.insightface
    networks:
      - face-attendance-network
    healthcheck:
      # NOTE: the real route is /api/face/health (health_routes.py mounts the
      # router with prefix="/api/face"). Probing "/health" returns 404 and,
      # because the backend waits on service_healthy, that would stop the
      # backend and the frontend from ever starting.
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/face/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      # InsightFace's buffalo_s pack is pre-baked into the image, but the
      # service also preloads every model synchronously in its lifespan hook,
      # so the first boot on CPU is not instant.
      start_period: 120s

  # ==========================================================
  # Spring Boot Backend
  # ==========================================================
  backend:
    build:
      context: ./backend-java
      dockerfile: ../Dockerfile.java
    container_name: face-attendance-backend
    restart: unless-stopped
    environment:
      # Database
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-face_attendance}
      DB_USERNAME: ${DB_USERNAME:-faceadmin}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required - copy .env.example to .env and set it}
      
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      
      # Face Service - Docker service name, never localhost
      FACE_SERVICE_URL: http://python-face-service:8000
      
      # JWT
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - generate one with "openssl rand -base64 32"}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      
      # CORS
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      
      # Recognition
      RECOGNITION_THRESHOLD: ${RECOGNITION_THRESHOLD:-0.6}
      
      # Student
      STUDENT_INITIAL_PASSWORD: ${STUDENT_INITIAL_PASSWORD:-student@123}
      
      # Attendance Session
      ATTENDANCE_RADIUS_METERS: ${ATTENDANCE_RADIUS_METERS:-50}
      ATTENDANCE_SESSION_MINUTES: ${ATTENDANCE_SESSION_MINUTES:-10}
      
      # Email
      MAIL_USERNAME: ${MAIL_USERNAME:?MAIL_USERNAME is required - set the SMTP account}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?MAIL_PASSWORD is required - use a Gmail App Password}
      
      # Super Admin
      SUPER_ADMIN_USERNAME: ${SUPER_ADMIN_USERNAME:?SUPER_ADMIN_USERNAME is required}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:?SUPER_ADMIN_EMAIL is required}
      SUPER_ADMIN_FULL_NAME: ${SUPER_ADMIN_FULL_NAME:?SUPER_ADMIN_FULL_NAME is required}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:?SUPER_ADMIN_PASSWORD is required}
      
      # Performance
      PERFORMANCE_MONITORING: ${PERFORMANCE_MONITORING:-true}
      
      # Upload directory
      PROFILE_PHOTOS_DIR: /app/uploads/profiles
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      # Persist uploaded profile photos
      - uploads_data:/app/uploads
    networks:
      - face-attendance-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      python-face-service:
        condition: service_healthy
    healthcheck:
      # There is no spring-boot-starter-actuator dependency, so
      # /actuator/health is a 404. Use the app's own public route.
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/face/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  # ==========================================================
  # React Frontend
  # ==========================================================
  frontend:
    build:
      context: ./frontend-UI
      dockerfile: ../Dockerfile.frontend
    container_name: face-attendance-frontend
    restart: unless-stopped
    environment:
      # Backend proxy target (used by Vite)
      BACKEND_ORIGIN: ${BACKEND_ORIGIN:-http://backend:8080}
      # API base URL (leave empty for same-origin)
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    networks:
      - face-attendance-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

# ==========================================================
# Volumes
# ==========================================================
volumes:
  mysql_data:
    name: face-attendance-mysql-data
  redis_data:
    name: face-attendance-redis-data
  insightface_models:
    name: face-attendance-insightface-models
  uploads_data:
    name: face-attendance-uploads

# ==========================================================
# Networks
# ==========================================================
networks:
  face-attendance-network:
    name: face-attendance-network
    driver: bridge
