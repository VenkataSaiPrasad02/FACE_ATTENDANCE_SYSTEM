# ============================================================
# Face Recognition Attendance Management System
# Spring Boot Application Properties
# ============================================================
# All sensitive values are read from environment variables.
# Set these in your OS environment or a .env file loader.
# ============================================================

# Server
server.port=8080
server.forward-headers-strategy=framework

# Database Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:face_attendance}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
# Using 'update' to handle schema changes without destroying existing data
# After initial cleanup, can change to 'validate' for production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Spring Security JWT aliases (used by JwtService)
application.security.jwt.secret=${JWT_SECRET}
application.security.jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS allowed origins
cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}

# Face Recognition Service (Python FastAPI)
face.service.url=${FACE_SERVICE_URL:http://localhost:8000}

# Recognition threshold - minimum confidence to consider a face match valid
recognition.threshold=${RECOGNITION_THRESHOLD:0.6}
face.recognition.threshold=${RECOGNITION_THRESHOLD:0.6}

# Frontend URL for CORS configuration
frontend.url=${FRONTEND_URL:http://localhost:5173}

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha


spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=prasadfb46@gmail.com
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# ===============================
# SUPER ADMIN CONFIGURATION
# ===============================

app.super-admin.username=${SUPER_ADMIN_USERNAME}
app.super-admin.email=${SUPER_ADMIN_EMAIL}
app.super-admin.full-name=${SUPER_ADMIN_FULL_NAME}
app.super-admin.password=${SUPER_ADMIN_PASSWORD}
# Redis (OTP / password reset state)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}


# Profile photo storage
app.upload.profile-photos-dir=${PROFILE_PHOTOS_DIR:uploads/profiles}
app.upload.profile-photos-base-url=/uploads/profiles
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===============================
# PERFORMANCE MONITORING (temporary instrumentation)
# ===============================
# When true, PerfMonitor prints [PERF] lines (timing / CPU / heap) for the
# face registration and attendance recognition flows. When false (default),
# no measurement work happens and nothing is printed — safe to leave in
# application.properties without affecting production logs.
performance.monitoring=${PERFORMANCE_MONITORING:true}

# ===============================
# OPTIONAL: Hibernate/JPA SQL + timing logging
# ===============================
# Not enabled by default — this can be verbose. Uncomment these to see every
# SQL statement Hibernate issues (useful for spotting N+1 queries / repeated
# queries) plus how long each takes, WITHOUT touching any repository code:
#
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.format_sql=true
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.orm.jdbc.bind=TRACE
#
# For aggregate stats (query counts, total DB time, cache hits) rather than
# a line per statement, enable Hibernate's built-in statistics collector
# instead — lighter-weight for spotting "N+1" patterns at a glance:
#
# spring.jpa.properties.hibernate.generate_statistics=true
# logging.level.org.hibernate.stat=DEBUG
#
# Turn all of the above off again before any real load testing — they add
# real overhead and will skew the [PERF] timings above.